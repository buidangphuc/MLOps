# Single guard: block secrets/keys from being committed. No lint/format/hygiene hooks.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        files: \.(json|ya?ml|toml|env(\.[^/]+)?|ini|cfg|py)$
        exclude: |
          (^tests?/fixtures?/)|(^docs?/)|(\.svg$)|(\.lock$)|(\.min\.(js|css)$)|
          (^node_modules/)|(^venv/)|(^\.venv/)|(^dist/)|(^build/)|(^\.git/)
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-lines
          - '-----BEGIN PUBLIC KEY-----'
