# Single guard: block secrets/keys from being committed. No lint/format/hygiene hooks.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        files: \.(json|ya?ml|toml|env(\.[^/]+)?|ini|cfg|py)$
        # single line: a YAML block here embeds newlines into the regex,
        # silently disabling every alternative after the first line.
        exclude: (^tests?/fixtures?/)|(^docs?/)|(\.svg$)|(\.lock$)|(\.min\.(js|css)$)|(^node_modules/)|(^venv/)|(^\.venv/)|(^dist/)|(^build/)|(^\.git/)|(^\.specify/integrations/)
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-lines
          - '-----BEGIN PUBLIC KEY-----'
