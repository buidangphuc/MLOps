name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (dev + cpu extras, editable)
        run: pip install -e .[dev,cpu]
      - name: Run tests
        run: pytest -q
