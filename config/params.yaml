# Base EXPERIMENT config: data + model + task + fine-tune + training + metrics + gate + tracking
# + registry. One run of `train` = one experiment; MLflow versions its hyperparams + metrics.
# Vary these PER-VARIANT in experiments.yaml and run `tune` to compare. Serving knobs live in
# serving.yaml; GPU targets in hardware.yaml; paths in constants/paths.py.
#
# The task is a causal-LM SFT: the classification label is the completion, and evaluation
# picks the label with the highest log-likelihood (infer/scoring.py).

ingestion:
  dataset_name: ag_news      # HF dataset pulled as a sample for first run.
  sample_size: 3000          # null = full split. To use your own data: set
                             # dataset_name: null and drop a JSONL at artifacts/data_ingestion/data.jsonl

data:
  text_field: text
  label_field: label
  val_size: 0.15             # validation (early-stop / model selection)
  test_size: 0.15            # held-out test (touched once, at evaluation)
  seed: 42
  leakage_check: true        # drop text exactly duplicated across splits
  group_field: null          # set a field to prevent group leakage (opt-in)

model:
  base_model: Qwen/Qwen2.5-0.5B-Instruct   # fine-tune from pretrained (not from scratch)
  max_length: 256                          # prompt + completion tokens (article text is trimmed to fit)

task:
  system_prompt: You are a news topic classifier. Reply with the topic name only.
  # {text} = the article, {labels} = candidate labels (from TRAIN only), comma-separated
  prompt_template: "Classify the news article into one of these topics: {labels}.\n\nArticle: {text}\n\nTopic:"

finetune:
  method: full               # full | lora | qlora | qat — compared as variants in experiments.yaml
  lora:                      # used by lora and qlora (they want a higher lr: see experiments.yaml)
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: null     # null = PEFT default for the architecture (q_proj, v_proj for Qwen)
  qat:
    scheme: int8-dyn         # used by method qat: the scheme the infer target must support

training:
  epochs: 1
  lr: 2.0e-5                 # full fine-tune; lora/qlora variants raise it
  train_batch_size: 8
  eval_batch_size: 16
  weight_decay: 0.0
  warmup_ratio: 0.05
  patience: 2                # early stopping on eval_loss
  save_total_limit: 2
  seed: 42
  max_steps: -1              # >0 caps steps (time-budget guard); -1 = use epochs
  oom_auto_retry: true       # on OOM, halve batch size and retry once

metrics:
  compute: [accuracy, macro_f1, micro_f1]   # accuracy|macro_f1|micro_f1|pr_auc|mcc
  objective: macro_f1        # what the gate reads (the trainer keeps the lowest-eval_loss checkpoint)
  per_class: true            # per-class P/R/F1 + confusion matrix
  error_dump: true           # write misclassified examples
  bootstrap_ci: true         # metric +/- 95% CI on test
  calibration: true          # ECE + temperature scaling (fit on val, saved)
  slice_field: null          # opt-in: per-segment metrics by this field

gate:
  enabled: true
  on_fail: error             # error (exit != 0) | warn
  rules:
    - {metric: macro_f1, min: 0.5}

tracking:
  backend: mlflow            # mlflow | tensorboard | none
  experiment_name: topic-sft
  tensorboard: false         # also write TB scalar logs alongside the backend (-> logs/tensorboard)
  log_histograms: false      # TB-only: weight + gradient histograms every N steps (debug convergence)

registry:
  name: TopicLLM
  remote:
    backend: none            # none | mlflow | sagemaker (remote not built yet)

# Opt-in: apply the training-throughput config tuned for this box (`datascience perf tune train`).
# A result tuned on a different GPU stops training with a hardware-mismatch error.
perf:
  apply_tuned: false

# DAPT (opt-in): `datascience dapt` continues causal-LM training on unlabeled domain text ->
# adapted backbone at artifacts/dapt; point a variant's model.base_model at it. Heavy -> GPU box.
dapt:
  corpus: null               # JSONL with a `text` field
  epochs: 1
