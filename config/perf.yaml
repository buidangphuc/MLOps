# Perf platform defaults — `datascience perf tune <workload> --entry module:fn`.
# Grids are cartesian; constraints prune; the best feasible trial by `objective` is stored
# under artifacts/perf/<role>/<hw_id>/ (bound to the box it ran on — see hardware.yaml).
# Precisions the role's TARGET GPU can't run (bf16 / int4-wo / fp8 on a T4) are dropped before
# measuring. Names are the PTQ schemes of perf/quant.py; torchao/bitsandbytes ones need the
# `quant` extra and are recorded infeasible (not fatal) where the library is missing.

infer:
  grid:
    backend: [torch]                      # the entry decides what each name builds
    precision: [fp32, fp16, bf16, int8-wo, int8-dyn, int4-wo, nf4, fp8]
    batch_size: [1, 8, 16, 32]
  lengths: [short, long]                  # NOT tuned: every trial runs all, worst one counts
  objective: throughput                   # items/s
  mode: max
  constraints:
    p99_ms: {max: 50}                     # latency budget per batch
    quality_drop: {max: 0.01}             # vs the first backend at fp32 (needs entry.score)
  iters: 50
  warmup: 5

train:
  grid:
    precision: [fp32, fp16, bf16]         # filtered by hardware.yaml targets.train capability
    tf32: [false, true]                   # forced off when the train target has no TF32
    torch_compile: [false, true]
    gradient_checkpointing: [false, true]
    dataloader_num_workers: [2, 8]
    # per_device_batch: [8, 16]           # omit -> auto max-fit per combo
  effective_batch: 32                     # per_device x grad_accum x gpus — held constant
  steps: 30                               # timed steps per trial (after warmup)
  warmup_steps: 5
  objective: samples_per_s
  mode: max
  constraints: {}

kernel:                                   # perf tune kernel <name> [--role train|infer]
  grid:
    num_warps: [1, 2, 4, 8, 16]
    num_stages: [1, 2, 3]
  objective: ms
  mode: min                               # correctness (max_abs_err vs torch) is enforced
  layernorm:
    dtype: fp16
    shapes: [[4096, 768], [4096, 1024], [16384, 768]]   # (rows, hidden) — one sweep each
