# Perf platform defaults — `datascience perf tune <workload> --entry module:fn`.
# Grids are cartesian; constraints prune; the best feasible trial by `objective` is stored
# under artifacts/perf/<role>/<hw_id>/ (bound to the box it ran on — see hardware.yaml).
# Precisions the role's TARGET GPU can't run (bf16 on a T4) are dropped before measuring.

infer:
  grid:
    backend: [torch]                      # the entry decides what each name builds
    precision: [fp32, fp16, bf16, int8]
    batch_size: [1, 8, 16, 32]
    length: [short, long]                 # the entry maps these to real input sizes
  objective: throughput                   # items/s
  mode: max
  constraints:
    p99_ms: {max: 50}                     # latency budget per batch
    quality_drop: {max: 0.01}             # vs the first backend at fp32 (needs entry.score)
  iters: 50
  warmup: 5
