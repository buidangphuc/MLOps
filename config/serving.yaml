# Serving / inference config — read by optimize / package / serve / deploy / bench.
# Separate from params.yaml: it's versioned with the DEPLOYED endpoint, not a training run.
#
# `device` picks the whole serving PATH (both expose the SAME request/response contract —
# {text} -> {entities}, so clients invoke either identically):
#   gpu  = PROD  -> Triton python-backend MME, torch fp16, GPU instance + autoscaling
#   cpu  = TEST  -> FastAPI wrapping Predictor (NO Triton), ONNX+int8, cheap CPU / serverless
device: gpu                    # gpu | cpu
runtime: torch                 # torch (gpu) | onnx (cpu path forces onnx+int8)

# Where the FastAPI/CPU serving path gets its weights (the GPU/Triton MME path pulls from
# S3 via ModelDataUrl already). The serving IMAGE ships code+deps only — no weights baked —
# so it's model-agnostic and swapping model is a config/env change, not a rebuild.
#   local    -> use on-disk artifacts/model_trainer/model (dev on the training box)
#   registry -> pull a version from the S3 model registry at startup (build serving anywhere)
model_source: local            # local | registry
model_version: latest          # v3 | latest — env MODEL_VERSION overrides this at run time
registry:                      # used when model_source: registry (mirror params.yaml push coords)
  name: GlinerNER
  # bucket/prefix/region are read from the ENVIRONMENT first (pick a .env.<env> file:
  # test/staging), falling back to these. Keep the real bucket out of committed config:
  #   S3_BUCKET, S3_PREFIX, AWS_REGION   (see .env.test.example / .env.staging.example)
  s3_bucket: null              # set S3_BUCKET in your .env.<env>
  s3_prefix: registry
  region: ap-southeast-1

optimize:
  quantize: int8-dynamic       # used on the ONNX/cpu path
  # Parity gate — after ONNX/int8 export, score torch vs onnx-int8 on val with the SAME
  # eval metric (per-entity F1) + measure latency, so quantization can't silently degrade
  # quality. FAILS if F1 drops more than max_f1_drop. Writes artifacts/optimize/parity.json.
  parity_check: true
  max_f1_drop: 0.01            # max allowed f1_torch - f1_onnx
  parity_sample: 2000          # val rows compared

# ---- GPU / prod: Triton python-backend Multi-Model Endpoint ------------------------------
triton:
  backend: python
  max_batch_size: 8            # per model (matches the prod Triton config)
  max_queue_delay_us: 5000     # dynamic batching window
  instance_group_count: 1      # Triton model instances per SageMaker instance

sagemaker:
  mode: MultiModel             # MME: one endpoint hosts N models, loaded by TargetModel
  region: ap-southeast-1
  s3_bucket: null              # FILL — never inferred from CWD/.env
  s3_prefix: bds-genai-deploy/models/v-REPLACE
  role_arn: null               # SageMaker execution role ARN
  triton_image: null           # region-specific SageMaker Triton DLC URI (see AWS docs)
  instance_type_gpu: ml.g4dn.xlarge
  instance_type_cpu: ml.c5.xlarge   # used when device=cpu (~2-3x cheaper than GPU)
  # The REAL models to host — one tar each. NO _1/_2 duplicates (that doubles GPU memory
  # on one instance without load-balancing — the deleted bug). Add suggestion/embedder here.
  models:
    - name: gliner_model_search
      checkpoint: artifacts/model_trainer/model   # trained GLiNER dir (from `train`)
  # Autoscaling — values are config, NOT hardcoded. Target-tracking on the metric below.
  autoscaling:
    enabled: true
    min_instances: 1
    max_instances: null        # FILL to your load ceiling
    metric: SageMakerVariantInvocationsPerInstance   # invocations/instance (GPUUtilization = custom, gpu-only)
    target_value: null         # FILL (e.g. requests/instance target)
    scale_in_cooldown_s: 300
    scale_out_cooldown_s: 60

# ---- CPU / test: FastAPI wrapping Predictor (no Triton) ----------------------------------
cpu_test:
  serving: fastapi             # fastapi | serverless (scale-to-zero, cheapest for sporadic test)
  port: 8080

# ---- analyze (POST-deploy serving-param tuning via Model Analyzer, GPU host) --------------
analyze:
  traffic_file: null           # JSONL of REAL captured requests ({"text": ...} per line)
  latency_budget_ms: 50
  max_instance_count: 4
  max_batch_size: 64
