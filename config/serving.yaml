# Serving / inference config (Phase 2) — read by optimize/package/serve/deploy/bench.
# Separate from params.yaml because it belongs to a different lifecycle (it's versioned
# with the deployed endpoint, not with a training experiment). Target GPU = Ampere+.

# Serving runtime:
#   torch (default) — serve the trained model directly, NO conversion (needs the model stack)
#   onnx  (opt-in)  — run `optimize` + `package` first; torch-free ONNX Runtime (lightweight/portable)
runtime: torch

optimize:
  quantize: none           # none | dynamic-int8  (fp32 ONNX is the portable default)

triton:
  max_batch_size: 32
  preferred_batch_sizes: [8, 16, 32]
  max_queue_delay_us: 5000
  instance_count: 1
  device: gpu              # gpu | cpu  (cpu = local docker on a non-GPU box)
  precision: fp16          # NOT wired — no code reads triton.precision. package_triton
                           # emits a TensorRT precision block (hardcoded FP16) COMMENTED OUT
                           # into the generated classifier config.pbtxt; uncomment + tune it
                           # on the GPU box. Kept here as the intended default.

sagemaker:
  instance_type: ml.g5.xlarge
  s3_bucket: null
  region: ap-southeast-1
  triton_image: null       # region-specific SageMaker Triton DLC URI (see AWS docs)
  role_arn: null           # SageMaker execution role

local:
  port: 8080               # informational only — the real port comes from `serve --port`
                           # (default 8080); this key is not read.

# `analyze` (serve_analyzer.py) — POST-DEPLOY serving-param tuning, driven by REAL traffic.
# Workflow: deploy with defaults -> capture real requests from the live endpoint into
# traffic_file -> `analyze` replays them while Model Analyzer sweeps the config and picks the
# best under the latency budget. Run on a prod-class GPU host (matches sagemaker.instance_type).
analyze:
  traffic_file: null             # REAL captured requests JSONL ({"text": ...}) = accurate config;
                                 # null = built-in MOCK traffic (approximate, for an initial tune)
  latency_budget_ms: 50          # p99 ceiling; configs above are dropped
  max_instance_count: 4          # search GPU instance_group count up to N
  max_batch_size: 64             # search dynamic_batching / max_batch_size up to N

# `monitor` — drift detection (warn-only, no labels). Compares captured prod inputs against the
# reference profile saved at eval. Does NOT retrain/gate — that needs labels + lifecycle (deferred).
monitor:
  traffic_file: null             # REQUIRED — captured prod inputs (JSONL {"text": ...});
                                 # monitor exits if unset (no mock fallback, unlike analyze)
  psi_warn: 0.2                  # predicted-label distribution drift (PSI): >0.1 moderate, >0.25 large
  confidence_drop_warn: 0.1      # drop in mean max-softmax confidence vs reference
  length_change_warn: 0.5        # relative change in mean input length vs reference
