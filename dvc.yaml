stages:
  ingest:
    cmd: python main.py ingest
    deps:
      - config/text_classification/params.yaml
      - src/datascience/components/data_ingestion.py
    outs:
      - artifacts/text_classification/data_ingestion/data.jsonl

  validate:
    cmd: python main.py validate
    deps:
      - artifacts/text_classification/data_ingestion/data.jsonl
      - src/datascience/components/data_validation.py
    outs:
      - artifacts/text_classification/data_validation/status.txt

  transform:
    cmd: python main.py transform
    deps:
      - artifacts/text_classification/data_ingestion/data.jsonl
      - artifacts/text_classification/data_validation/status.txt
      - config/text_classification/params.yaml
      - src/datascience/components/data_transformation.py
    outs:
      - artifacts/text_classification/data_transformation/train.jsonl
      - artifacts/text_classification/data_transformation/val.jsonl
      - artifacts/text_classification/data_transformation/test.jsonl
      - artifacts/text_classification/data_transformation/label_map.json

  train:
    cmd: python main.py train
    deps:
      - artifacts/text_classification/data_transformation/train.jsonl
      - artifacts/text_classification/data_transformation/val.jsonl
      - artifacts/text_classification/data_transformation/label_map.json
      - config/text_classification/params.yaml
      - src/datascience/components/model_trainer.py
    outs:
      - artifacts/text_classification/model_trainer/model

  evaluate:
    cmd: python main.py eval
    deps:
      - artifacts/text_classification/model_trainer/model
      - artifacts/text_classification/data_transformation/test.jsonl
      - config/text_classification/params.yaml
      - src/datascience/components/model_evaluation.py
    metrics:
      - artifacts/text_classification/model_evaluation/metrics.json:
          cache: false
