schema: spec-driven

# Project context shown to AI when creating artifacts. The rules themselves live in
# docs/agents/pipeline.md (single source of truth) — read it, don't restate it here.
context: |
  Python MLOps repo, package `datascience` (src/datascience), Python 3.11, HF transformers + torch.
  Multi-model platform (src/datascience) + one pack per model (packs/<pack>) + GPU perf platform (perf/).
  Project facts: docs/agents/project.md. Rules, invariants and gotchas: docs/agents/pipeline.md.
  Tests: `make test` (offline, no GPU, no downloads; `tmp_artifacts` and `toy_model` fixtures in tests/conftest.py).
  Only pre-commit hook: detect-secrets. All artifacts are written in English.

rules:
  specs:
    - Every requirement has at least one `#### Scenario:` that an offline pytest can check
  tasks:
    - One section per implementation phase; each section ends with "make test green"
